apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-service
  template:
    metadata:
      labels:
        app: backend-service
    spec:
      containers:
      - name: backend-service
        image: docker-backend-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5001
        env:
        - name: MYSQL_HOST
          value: "mysqldb"
        - name: MYSQL_USER
          value: "root"
        - name: MYSQL_PASSWORD
          value: "123456"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  ports:
  - port: 5001
    targetPort: 5001
  selector:
    app: backend-service
  type: ClusterIP
